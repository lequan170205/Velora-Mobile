name: Apply Video Call Provider Patch

on:
  push:
    branches:
      - feat/video-call-1to1
    paths:
      - scripts/apply-video-call-provider-patch.cjs
      - scripts/apply-video-call-native-contract-patch.cjs
      - .github/workflows/video-call-provider-patch.yml
  pull_request:
    branches:
      - feat/video-call-1to1
    paths:
      - scripts/apply-video-call-provider-patch.cjs
      - scripts/apply-video-call-native-contract-patch.cjs
      - scripts/video-call-ci-trigger.txt
      - .github/workflows/video-call-provider-patch.yml

permissions:
  contents: write

concurrency:
  group: video-call-provider-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-call-1to1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply guarded patches
        id: patch
        shell: bash
        run: |
          set +e
          {
            node scripts/apply-video-call-provider-patch.cjs
            provider=$?
            node scripts/apply-video-call-native-contract-patch.cjs
            native=$?
            exit $(( provider || native ))
          } > /tmp/patch.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/patch.log
          exit 0
      - name: Install dependencies
        if: steps.patch.outputs.code == '0'
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Verify feature branch
        if: steps.patch.outputs.code == '0'
        shell: bash
        run: |
          set +e
          pnpm type-check > /tmp/typecheck.log 2>&1
          TYPECHECK=$?
          pnpm test > /tmp/test.log 2>&1
          TEST=$?
          pnpm lint > /tmp/lint.log 2>&1
          LINT=$?
          {
            echo '# Video Call CI Result'
            echo
            echo "- Typecheck exit: $TYPECHECK"
            echo "- Tests exit: $TEST"
            echo "- Lint exit: $LINT"
            echo
            echo '## Typecheck'
            echo '```text'
            tail -n 160 /tmp/typecheck.log
            echo '```'
            echo
            echo '## Tests'
            echo '```text'
            tail -n 160 /tmp/test.log
            echo '```'
            echo
            echo '## Lint'
            echo '```text'
            tail -n 160 /tmp/lint.log
            echo '```'
          } > VIDEO_CALL_CI_RESULT.md
          exit 0
      - name: Record patch failure
        if: steps.patch.outputs.code != '0'
        shell: bash
        run: |
          {
            echo '# Video Call CI Result'
            echo
            echo '- Guarded patch failed before verification.'
            echo
            echo '```text'
            cat /tmp/patch.log
            echo '```'
          } > VIDEO_CALL_CI_RESULT.md
      - name: Commit generated feature changes and result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/providers/CallProvider.tsx \
            src/types/call.types.ts \
            'app/conversation/[id].tsx' \
            modules/velora-system-calls/ios/VeloraSystemCallsModule.swift \
            VIDEO_CALL_CI_RESULT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(call): integrate video into hardened call provider'
          git push origin HEAD:feat/video-call-1to1
