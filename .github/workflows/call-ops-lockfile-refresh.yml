name: Call Ops Lockfile Refresh

on:
  push:
    branches:
      - feat/prometheus-grafana-monitoring
    paths:
      - 'apps/call-ops-dashboard/package.json'
      - '.github/workflows/call-ops-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/call-ops-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile
        run: pnpm --ignore-workspace install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore(call-ops): update chart dependencies lockfile'
          git push origin HEAD:feat/prometheus-grafana-monitoring
