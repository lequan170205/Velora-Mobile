name: Temp Fix Read Receipt Persistence

on:
  push:
    branches:
      - fix/chat-realtime-regressions

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/chat-realtime-regressions

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/tmp-fix-read-receipt-persistence.cjs
      - run: pnpm exec prettier --write src/database/messageSync.ts src/providers/SocketProvider.tsx tests/chat-realtime-regressions-contract.test.cjs
      - run: node --test tests/chat-realtime-regressions-contract.test.cjs tests/group-chat-ui-contract.test.cjs
      - run: pnpm type-check
      - run: pnpm exec eslint src/database/messageSync.ts src/providers/SocketProvider.tsx
      - run: git diff --check

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/database/messageSync.ts src/providers/SocketProvider.tsx tests/chat-realtime-regressions-contract.test.cjs
          git commit -m 'fix(chat): persist group read frontiers across authors'
          git push origin HEAD:fix/chat-realtime-regressions
