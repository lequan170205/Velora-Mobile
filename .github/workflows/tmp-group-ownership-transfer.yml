name: Temp Group Ownership Transfer Mobile

on:
  push:
    branches:
      - feat/group-ownership-transfer
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/group-ownership-transfer

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/tmp-group-ownership-transfer.cjs
      - run: pnpm exec prettier --write src/api/conversation.api.ts 'app/conversation/[id]/info.tsx' tests/group-chat-ui-contract.test.cjs
      - run: node --test tests/group-chat-ui-contract.test.cjs tests/group-chat-data-plumbing-contract.test.cjs
      - run: pnpm type-check
      - run: pnpm exec eslint src/api/conversation.api.ts 'app/conversation/[id]/info.tsx'
      - run: git diff --check

      - name: Commit verified product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/conversation.api.ts 'app/conversation/[id]/info.tsx' tests/group-chat-ui-contract.test.cjs
          git commit -m 'feat(chat): add group ownership transfer UI'
          git push origin HEAD:feat/group-ownership-transfer
