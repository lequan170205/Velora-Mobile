name: Validate chat timeline hardening

on:
  push:
    branches:
      - fix/chat-timeline-scroll-stability
    paths:
      - .github/workflows/chat-timeline-hardening.yml
      - src/hooks/useMessages.ts
      - src/hooks/useAnchoredMessages.ts
      - src/lib/chatTimelineDiagnostics.ts
      - tests/chat-timeline-characterization.test.cjs
      - docs/CHAT_TIMELINE_HARDENING.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/chat-timeline-scroll-stability
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact lint cleanup
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'src/hooks/useMessages.ts'
          let source = fs.readFileSync(file, 'utf8')
          const before = `  onLatestSyncRangeUpdated,\n  queryClient,\n}: MessagesQueryOptionsInput) => ({`
          const after = `  onLatestSyncRangeUpdated,\n}: MessagesQueryOptionsInput) => ({`
          const matches = source.split(before).length - 1
          if (matches !== 1) {
            throw new Error(`Expected one queryClient cleanup match, found ${matches}`)
          }
          source = source.replace(before, after)
          fs.writeFileSync(file, source)
          NODE

      - name: Run validation and capture status
        id: checks
        shell: bash
        run: |
          set +e
          npm test > /tmp/chat-test.log 2>&1
          TEST_STATUS=$?
          npm run type-check > /tmp/chat-typecheck.log 2>&1
          TYPECHECK_STATUS=$?
          npm run lint > /tmp/chat-lint.log 2>&1
          LINT_STATUS=$?
          echo "test_status=$TEST_STATUS" >> "$GITHUB_OUTPUT"
          echo "typecheck_status=$TYPECHECK_STATUS" >> "$GITHUB_OUTPUT"
          echo "lint_status=$LINT_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$TEST_STATUS" -eq 0 ] && [ "$TYPECHECK_STATUS" -eq 0 ] && [ "$LINT_STATUS" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Record validation result
        shell: bash
        run: |
          rm -f docs/CHAT_TIMELINE_VALIDATION.md docs/CHAT_TIMELINE_VALIDATION_FAILURE.md
          if [ "${{ steps.checks.outputs.passed }}" = "true" ]; then
            cat > docs/CHAT_TIMELINE_VALIDATION.md <<'EOF'
          # Chat Timeline Validation

          Automated validation passed on `fix/chat-timeline-scroll-stability`.

          - `npm test`: passed
          - `npm run type-check`: passed
          - `npm run lint`: passed

          Scope validated: latest older pagination, anchor older pagination, timeline diagnostics, and characterization contracts. Existing inverted FlashList/reply-jump/own-send scroll ownership remains unchanged.
          EOF
            rm -f scripts/apply-chat-timeline-hardening.cjs
            rm -f .github/workflows/chat-timeline-hardening.yml
          else
            {
              echo '# Chat Timeline Validation Failure'
              echo
              echo "- npm test status: ${{ steps.checks.outputs.test_status }}"
              echo "- type-check status: ${{ steps.checks.outputs.typecheck_status }}"
              echo "- lint status: ${{ steps.checks.outputs.lint_status }}"
              echo
              echo '## Test tail'
              echo '```'
              tail -n 60 /tmp/chat-test.log
              echo '```'
              echo
              echo '## Type-check tail'
              echo '```'
              tail -n 80 /tmp/chat-typecheck.log
              echo '```'
              echo
              echo '## Lint tail'
              echo '```'
              tail -n 80 /tmp/chat-lint.log
              echo '```'
            } > docs/CHAT_TIMELINE_VALIDATION_FAILURE.md
          fi

      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validation changes to commit"
            exit 0
          fi
          if [ "${{ steps.checks.outputs.passed }}" = "true" ]; then
            git commit -m "test: validate chat timeline hardening"
          else
            git commit -m "test: record chat timeline validation failure"
          fi
          git push origin HEAD:fix/chat-timeline-scroll-stability
