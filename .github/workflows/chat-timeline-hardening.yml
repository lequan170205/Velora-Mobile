name: Validate chat timeline hardening

on:
  push:
    branches:
      - fix/chat-timeline-scroll-stability
    paths:
      - .github/workflows/chat-timeline-hardening.yml
      - src/hooks/useMessages.ts
      - src/hooks/useAnchoredMessages.ts
      - src/lib/chatTimelineDiagnostics.ts
      - tests/chat-timeline-characterization.test.cjs
      - docs/CHAT_TIMELINE_HARDENING.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/chat-timeline-scroll-stability
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Record validation success and remove temporary automation
        run: |
          cat > docs/CHAT_TIMELINE_VALIDATION.md <<'EOF'
          # Chat Timeline Validation

          Automated validation passed on the `fix/chat-timeline-scroll-stability` branch.

          - `npm test`: passed
          - `npm run type-check`: passed
          - `npm run lint`: passed

          The production hardening keeps the existing inverted FlashList architecture while making latest older pagination retryable/authoritative and anchor older pagination a single local+remote transaction.
          EOF
          rm -f scripts/apply-chat-timeline-hardening.cjs
          rm -f .github/workflows/chat-timeline-hardening.yml

      - name: Commit validation marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: validate chat timeline hardening"
          git push origin HEAD:fix/chat-timeline-scroll-stability
