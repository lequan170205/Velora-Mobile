name: Chat timeline hardening

on:
  push:
    branches:
      - fix/chat-timeline-scroll-stability
    paths:
      - .github/workflows/chat-timeline-hardening.yml
      - scripts/apply-chat-timeline-hardening.cjs
      - src/lib/chatTimelineDiagnostics.ts
      - tests/chat-timeline-characterization.test.cjs
      - docs/CHAT_TIMELINE_HARDENING.md

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/chat-timeline-scroll-stability
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded production patch
        run: node scripts/apply-chat-timeline-hardening.cjs

      - name: Run repository tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Remove temporary patch automation
        run: |
          rm scripts/apply-chat-timeline-hardening.cjs
          rm .github/workflows/chat-timeline-hardening.yml

      - name: Commit validated hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden chat timeline pagination and scroll stability"
          git push origin HEAD:fix/chat-timeline-scroll-stability
